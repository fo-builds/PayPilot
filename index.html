<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayPilot - AI shopping agent with real PayPal sandbox checkout</title>
<style>
  :root { --ink:#142c8e; --bg:#f7f8fc; --card:#ffffff; --ok:#0a7d38; --warn:#8a6100; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:#111; }
  header { background:var(--ink); color:#fff; padding:18px 24px; display:flex; gap:12px; align-items:center; }
  header h1 { font-size:20px; font-weight:700; }
  header .tag { background:rgba(255,255,255,.15); border-radius:99px; padding:4px 12px; font-size:12px; }
  main { max-width:1080px; margin:24px auto; padding:0 16px; display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:820px){ main{grid-template-columns:1fr;} }
  section { background:var(--card); border:1px solid #e6e8f0; border-radius:14px; padding:18px; }
  h2 { font-size:15px; margin-bottom:12px; color:var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
  .prod { border:1px solid #e6e8f0; border-radius:10px; padding:12px; }
  .prod .name { font-weight:600; font-size:14px; }
  .prod .meta { color:#556; font-size:12px; margin-top:4px; }
  .prod .price { font-weight:700; margin-top:6px; }
  .chat { display:flex; flex-direction:column; gap:10px; min-height:420px; }
  #log { display:flex; flex-direction:column; gap:8px; overflow-y:auto; max-height:520px; }
  .bubble { border-radius:10px; padding:10px 12px; font-size:13.5px; line-height:1.45; max-width:92%; }
  .agent { background:#eef2ff; align-self:flex-start; }
  .step { background:#f2f4f9; border:1px dashed #ccd3e6; color:#333; font-size:12.5px; align-self:stretch; max-width:100%; font-family:ui-monospace,Menlo,monospace; white-space:pre-wrap; }
  .paid { background:#e6f6ec; color:var(--ok); font-weight:600; }
  form { display:flex; gap:8px; margin-top:12px; }
  input { flex:1; padding:11px 12px; border:1px solid #ccd3e6; border-radius:9px; font-size:14px; }
  button { background:var(--ink); color:#fff; border:0; border-radius:9px; padding:11px 18px; font-size:14px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .hint { font-size:12px; color:#667; margin-top:8px; }
  footer { text-align:center; color:#778; font-size:12px; padding:18px 0 30px; }
</style>
</head>
<body>
<header>
  <h1>PayPilot</h1>
  <span class="tag">AI shopping agent</span>
  <span class="tag">PayPal sandbox checkout</span>
</header>
<main>
  <section>
    <h2>Demo store</h2>
    <div class="grid" id="catalog"></div>
    <p class="hint">The agent browses this catalog with its <code>search_products</code> tool, picks what fits your request, and checks out with PayPal on its own.</p>
  </section>
  <section>
    <h2>Agent console</h2>
    <div class="chat">
      <div id="log"></div>
      <form id="f"><input id="q" placeholder="e.g. get me the best wireless earbuds under $60" autocomplete="off"><button id="go">Send</button></form>
    </div>
  </section>
</main>
<footer>PayPilot runs entirely on PayPal sandbox REST APIs. No real money moves.</footer>
<script>
const log = document.getElementById('log');
function add(cls, text){ const d=document.createElement('div'); d.className='bubble '+cls; d.textContent=text; log.appendChild(d); log.scrollTop=log.scrollHeight; return d; }
fetch('/api/catalog').then(r=>r.json()).then(data=>{
  const rows = Array.isArray(data) ? data : (data.products || []);
  document.getElementById('catalog').innerHTML = rows.map(p=>
    `<div class="prod"><div class="name">${p.name}</div><div class="meta">${p.category} · ★${p.rating} (${p.reviews})</div><div class="meta">${p.description}</div><div class="price">$${p.price.toFixed(2)}</div></div>`).join('');
});
document.getElementById('f').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const q=document.getElementById('q'); const msg=q.value.trim(); if(!msg) return;
  q.value=''; add('agent', msg);
  const go=document.getElementById('go'); go.disabled=true; go.textContent='Working…';
  try{
    const r=await fetch('/api/agent/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
    const d=await r.json();
    if(d.error){ add('step','error: '+d.error); }
    (d.steps||[]).forEach(s=>{
      if(s.type==='thought') add('step','thinking: '+(s.text||'')+'\n→ tool '+s.tool+' '+JSON.stringify(s.args||{}));
      else if(s.type==='action') add('step','action: '+s.tool+' '+JSON.stringify(s.args||{}));
      else if(s.type==='tool_result') add('step','← '+JSON.stringify(s.result).slice(0,500));
      else if(s.type==='reply') add('agent', s.text);
      else if(s.type==='capture'){ const c=s.result||{}; add(c.status==='COMPLETED'?'paid':'step', c.status==='COMPLETED' ? ('Payment completed: '+c.order_id+' · '+c.currency+' '+c.amount+' · capture '+c.capture_id) : ('capture: '+JSON.stringify(c).slice(0,400))); }
    });
  }catch(err){ add('step','error: '+err.message); }
  go.disabled=false; go.textContent='Send';
});
add('agent',"Hi! I'm PayPilot. Tell me what you're shopping for and I'll pick it and complete the PayPal sandbox checkout myself.");
</script>
</body>
</html>
